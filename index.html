<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EXERCICIS"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>EXERCICIS</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0c1827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.app{width:min(100%,430px);text-align:center}.logo{width:84px;height:84px;border-radius:23px;background:#222;display:grid;place-items:center;font-size:60px;margin:0 auto 20px;font-weight:300}h1{font-size:28px;letter-spacing:.08em;margin:0 0 7px}p{color:#bac7d5;line-height:1.5}.choice{display:block;width:100%;padding:19px;border:0;border-radius:15px;margin:14px 0;background:#2d80e5;color:#fff;font-size:19px;font-weight:700;cursor:pointer}.choice.secondary{background:#273b52}.note{font-size:13px;margin-top:23px}#player{display:none;position:fixed;inset:0;background:#000;z-index:2;flex-direction:column}#player.show{display:flex}video{width:100%;height:calc(100% - 62px);object-fit:contain}#back{background:#142b43;color:#fff;border:0;padding:17px;font-size:16px}#status{min-height:24px}</style></head><body><main class="app"><div class="logo">C</div><h1>EXERCICIS</h1><p>8 exercicis · 30 segons cadascun · 4 minuts</p><button class="choice" onclick="play('music')">▶ Amb música</button><button class="choice secondary" onclick="play('quiet')">▶ Sense música</button><p class="note">Els avisos 3 · 2 · 1 sonen al final de cada exercici.</p><p class="note" id="status"></p></main><section id="player"><video id="video" controls playsinline preload="none"></video><button id="back" onclick="closePlayer()">← Tornar als exercicis</button></section><script>const videos={music:'https://d2ol7oe51mr4n9.cloudfront.net/user_3M1C0ASodoWvulKcRwQka7Sr4Xi/b4a20ea5-9437-4c72-9525-d3bbeb51e14d.mp4',quiet:'https://d2ol7oe51mr4n9.cloudfront.net/user_3M1C0ASodoWvulKcRwQka7Sr4Xi/6fb7e9ef-4f9a-4319-96e6-1dfaeff4c2c0.mp4'};const v=document.getElementById('video');function play(kind){v.src=videos[kind];document.getElementById('player').classList.add('show');v.play().catch(()=>{document.getElementById('status').textContent='Prem el botó de reproducció per començar.'})}function closePlayer(){v.pause();v.removeAttribute('src');v.load();document.getElementById('player').classList.remove('show')}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
